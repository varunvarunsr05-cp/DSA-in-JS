<body>
    <script>
        
        function uniChar(str){
            count={};
            for (let char of str) {
                count[char]=(count[char]||0)+1;
            }
            for (const char of str) {
                if (count[char]==1) {
                    return char;
                }
            }
            return null
        }

        console.log(uniChar("aabccmmdd"))
    </script>
</body>
