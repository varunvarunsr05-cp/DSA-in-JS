<body>
    <script>
        let str="hello world of javascript"
        function capitalizeWord(str){
            let words=str.split(" ")
            let result=[];
            let final="";


            for (const word of words) {
                result.push(word[0].toUpperCase()+word.slice(1))
                 final =result.join(" ");
            }
            console.log(final)
        }
        capitalizeWord(str)
    </script>
</body>
