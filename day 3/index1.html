<!-- write a function to reverse each word in a sentance without changing the word order -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // let nums=[1,2,3,4]
        
        // console.log(sentance.split(" "));
        let sentance="hello world";
        let splited=sentance.split(" ");
        console.log(splited);

        function reverseWord(){
            let reverse="";
            let word="";

            for (let i = 0; i < splited.length; i++) {
                word=splited[i];
                for (let i = word.length-1; i>=0 ; i--) {
                    // console.log(word[i])
                    reverse+=word[i];  
                }
                reverse+=" ";
                // console.log("word is,",word)
            }
            console.log(`Each word reverse of "${sentance}" is "${reverse}"`);
        }

        reverseWord()
    </script>
</body>
</html>
